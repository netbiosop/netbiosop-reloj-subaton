<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Reloj Subatón</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e0d12; color: #ecebf2; font: 15px/1.45 system-ui, sans-serif; padding: 16px; }
  form { width: 100%; max-width: 340px; background: #17151e; border: 1px solid #2b2737; border-radius: 14px; padding: 24px; display: grid; gap: 14px; }
  h1 { margin: 0; font-size: 22px; display: flex; align-items: center; gap: 10px; }
  h1 i { width: 12px; height: 12px; border-radius: 50%; background: #a77bff; box-shadow: 0 0 12px #a77bff; }
  p { margin: 0; color: #9a96ab; font-size: 13px; }
  input { font: inherit; color: inherit; background: #0c0b10; border: 1px solid #2b2737; border-radius: 9px; padding: 10px 12px; width: 100%; }
  input:focus { outline: none; border-color: #a77bff; }
  button { font: inherit; font-weight: 600; color: #fff; background: #7c4dff; border: 0; border-radius: 10px; padding: 11px; cursor: pointer; }
  button:disabled { opacity: .6; }
  .err { color: #ff5d73; font-size: 13px; min-height: 18px; }
</style>
</head>
<body>
<form id="f">
  <h1><i></i> Reloj Subatón</h1>
  <p>Entra con el usuario y la contraseña que te dio el dueño del canal.</p>
  <input id="user" placeholder="Usuario" autocomplete="username" autocapitalize="none" autofocus required>
  <input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password" required>
  <button id="go">Entrar</button>
  <div class="err" id="err"></div>
</form>
<script>
  document.getElementById('f').onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('go');
    const err = document.getElementById('err');
    btn.disabled = true;
    err.textContent = '';
    try {
      const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user: document.getElementById('user').value, password: document.getElementById('pw').value }) });
      const j = await r.json().catch(() => ({}));
      if (r.ok) location.href = j.role === 'owner' ? '/panel' : '/mod';
      else err.textContent = j.error || 'No se pudo entrar';
    } catch {
      err.textContent = 'No se pudo conectar con el reloj';
    }
    btn.disabled = false;
  };
</script>
</body>
</html>
