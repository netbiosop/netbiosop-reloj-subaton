<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Apoya a un creador</title>
<link rel="stylesheet" href="marca.css">
<style>
  /* Fuente de navegador: 520 × 230. Aparece sola cada X minutos (se configura en /codigo-panel) */
  #wrap{position:relative;width:520px;height:230px;transform-origin:top left;overflow:hidden}
  .card{position:absolute;left:8px;top:14px;width:500px;opacity:0}
  .card.entra{animation:entra .6s cubic-bezier(.2,.9,.3,1.2) both}
  .card.sale{animation:sale .5s ease-in forwards}
  .cab{display:flex;align-items:center;gap:10px}
  .cab .m-titulo{font-size:34px}
  .fila-plat{display:flex;align-items:center;gap:10px;margin-top:8px}
  .para{font-weight:800;font-size:18px;text-transform:uppercase;letter-spacing:.8px;text-shadow:var(--contorno-duro)}
  .plat{display:inline-flex;align-items:stretch;height:32px;transform:skewX(-12deg);box-shadow:0 2px 8px rgba(0,0,0,.6);max-width:390px}
  .plat > span{display:flex;align-items:center;white-space:nowrap;overflow:hidden}
  .plat > span > i{font-style:normal;transform:skewX(12deg);display:inline-block}
  .plat .j{padding:2px 12px 0;background:#f4f5f7;color:#111;font-family:var(--f-titulo);font-size:26px;letter-spacing:1.2px;line-height:1}
  .plat .t{padding:0 12px;background:linear-gradient(90deg,var(--rojo),var(--rojo-oscuro));font-weight:800;font-size:16px;letter-spacing:1px;text-transform:uppercase}
  .plat.flip{animation:flip .5s ease-in-out}
  .puntos{display:flex;gap:5px;margin-left:2px}
  .puntos b{width:9px;height:9px;transform:skewX(-12deg);background:rgba(255,255,255,.3);box-shadow:0 0 0 1px #000}
  .puntos b.on{background:var(--rojo-claro);box-shadow:0 0 6px var(--rojo)}
  .caja{position:relative;margin-top:8px;display:flex;align-items:center;gap:10px;padding:10px 12px;background:linear-gradient(180deg,rgba(20,4,6,.88),rgba(8,8,10,.92));
        clip-path:polygon(0 0,100% 0,100% 72%,96.5% 100%,0 100%);box-shadow:inset 0 0 0 2px rgba(227,18,27,.6)}
  .campo{flex:1;min-width:0;height:52px;display:flex;align-items:center;padding:0 14px;background:#f4f5f7;transform:skewX(-10deg);box-shadow:inset 0 2px 6px rgba(0,0,0,.4);overflow:hidden}
  .campo span{transform:skewX(10deg);font-family:var(--f-titulo);font-size:40px;letter-spacing:2px;color:#111;line-height:1;display:flex;align-items:center;white-space:nowrap}
  .caret{display:inline-block;width:3px;height:34px;background:var(--rojo);margin-left:3px;animation:parpadeo .5s steps(1) infinite}
  .btn{position:relative;height:52px;padding:0 22px;display:grid;place-items:center;font-family:var(--f-titulo);font-size:30px;letter-spacing:1px;color:#fff;overflow:hidden;
       background:linear-gradient(180deg,var(--rojo-claro),var(--rojo) 55%,var(--rojo-oscuro));transform:skewX(-10deg);box-shadow:0 3px 0 #4a0408,0 0 14px rgba(227,18,27,.6)}
  .btn i{font-style:normal;transform:skewX(10deg)}
  .btn.click{animation:click .35s ease}
  .ok{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(90deg,#8e0a10,#e3121b,#8e0a10);
      font-family:var(--f-titulo);font-size:36px;letter-spacing:1.5px;text-shadow:0 2px 0 #3a0003;clip-path:inset(0 100% 0 0);transition:clip-path .45s cubic-bezier(.3,.9,.3,1);white-space:nowrap}
  .ok.on{clip-path:inset(0 0 0 0)}
  .ok::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);background-size:250% 100%;background-position:150% 0}
  .ok.on::after{animation:brillo 1.4s ease .5s 2}
  .ok .tick{display:grid;place-items:center;width:40px;height:40px;flex:0 0 40px;background:#fff;color:var(--rojo);font-size:28px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);transform:scale(0)}
  .ok.on .tick{animation:tick .5s cubic-bezier(.3,1.8,.5,1) .3s both}
  .disc{display:block;margin-top:6px;font-weight:700;font-size:14px;letter-spacing:.3px;color:#d6d9df;text-shadow:var(--contorno-duro)}
  .puntero{position:absolute;width:30px;height:30px;z-index:5;opacity:0;filter:drop-shadow(0 2px 3px #000);transition:transform .9s cubic-bezier(.4,0,.2,1),opacity .3s}
  .moneda{position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;pointer-events:none;z-index:6;
          background:radial-gradient(circle at 35% 30%,#fff6c9,#ffc83a 35%,#c98a00 70%,#7a4d00);box-shadow:inset 0 -3px 0 rgba(0,0,0,.35),0 0 10px rgba(255,200,58,.6)}
  .moneda::after{content:"B";position:absolute;inset:5px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-titulo);font-size:17px;color:#fff;background:var(--rojo);box-shadow:inset 0 0 0 2px #8e0a10}
  @keyframes entra{from{opacity:0;transform:translateX(-80px) skewX(-12deg)}to{opacity:1;transform:none}}
  @keyframes sale{from{opacity:1}to{opacity:0;transform:translateX(60px) skewX(-12deg)}}
  @keyframes parpadeo{50%{opacity:0}}
  @keyframes click{40%{transform:skewX(-10deg) translateY(4px) scale(.94);box-shadow:0 0 0 #4a0408,0 0 24px rgba(255,74,82,.9)}}
  @keyframes brillo{to{background-position:-50% 0}}
  @keyframes tick{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
  @keyframes flip{0%,100%{transform:skewX(-12deg) rotateX(0)}50%{transform:skewX(-12deg) rotateX(90deg)}}
</style>
</head>
<body>
<div id="wrap">
  <div class="card" id="card">
    <div class="cab"><span class="m-hex"><svg class="ic" viewBox="0 0 32 32"><path d="M16 3l3.6 7.6 8.3 1-6.1 5.7 1.6 8.2L16 21.4l-7.4 4.1 1.6-8.2-6.1-5.7 8.3-1z" fill="#fff"/></svg></span><span class="m-titulo" id="titulo"></span></div>
    <div class="fila-plat"><span class="para">Para</span><span class="plat" id="plat"><span class="j"><i id="juego"></i></span><span class="t"><i id="tienda"></i></span></span><span class="puntos" id="puntos"></span></div>
    <div class="caja">
      <div class="campo"><span><b id="cod" style="font-weight:400"></b><i class="caret"></i></span></div>
      <div class="btn" id="btn"><i>ACEPTAR</i></div>
      <div class="ok" id="ok"><span class="tick">✔</span><span id="gracias"></span></div>
    </div>
    <span class="disc" id="disc"></span>
  </div>
  <svg class="puntero" id="puntero" viewBox="0 0 24 24"><path d="M3 2l17 9.5-7.4 1.6 4.3 7.6-3 1.7-4.3-7.6L4 20z" fill="#fff" stroke="#000" stroke-width="1.4"/></svg>
</div>
<script>
// Tarjeta "Apoya a un creador". Sale sola cuando el reloj lo indica (cada X minutos, desde /codigo-panel)
// o con "Mostrar ahora". Opciones en la URL:  ?escala=1.2   ?demo=1 (se repite sola, para probar)
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const escala = parseFloat(params.get('escala'));
if (escala > 0) $('wrap').style.transform = `scale(${escala})`;
const espera = (ms) => new Promise((r) => setTimeout(r, ms));
const replay = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
let cfg = null, corrida = 0;

function titulo(t){ const [a, ...b] = String(t).split(' ').reverse(); const el = $('titulo'); el.textContent = b.reverse().join(' ') + (b.length ? ' ' : ''); const em = document.createElement('em'); em.textContent = a; el.appendChild(em); }
function ponerPlat(p, k, n){
  $('juego').textContent = (p.juego || '').toUpperCase();
  $('tienda').textContent = p.tienda ? 'en ' + p.tienda : '';
  $('tienda').parentNode.style.display = p.tienda ? '' : 'none';
  $('disc').textContent = p.aviso || '';
  $('puntos').innerHTML = n > 1 ? Array.from({length:n}, (_, i) => `<b class="${i===k?'on':''}"></b>`).join('') : '';
}
async function tipear(texto, cadaMs, id){
  const el = $('cod'); el.textContent = '';
  for (const ch of texto){ if (id !== corrida) return; el.textContent += ch; await espera(cadaMs); }
}
function monedas(n, x, y){
  for (let i = 0; i < n; i++){
    const m = document.createElement('div'); m.className = 'moneda'; $('wrap').appendChild(m);
    const a = Math.PI + Math.random() * Math.PI, v = 70 + Math.random() * 120;
    const dx = Math.cos(a) * v, dy = Math.sin(a) * v * .9;
    m.animate([
      { transform: `translate(${x}px,${y}px) rotateY(0) scale(.5)`, opacity: 1 },
      { transform: `translate(${x+dx}px,${y+dy}px) rotateY(540deg) scale(1)`, opacity: 1, offset: .35 },
      { transform: `translate(${x+dx*1.5}px,250px) rotateY(1080deg) scale(1)`, opacity: .9 }
    ], { duration: 1300 + Math.random() * 700, delay: Math.random() * 250, easing: 'cubic-bezier(.3,.1,.6,1)', fill: 'both' }).onfinish = () => m.remove();
  }
}
async function mostrar(durSeg){
  if (!cfg) return;
  const id = ++corrida, fin = Date.now() + durSeg * 1000 - 600;
  const plats = (cfg.plataformas || []).filter((p) => p.on !== false && (p.codigo || p.juego));
  if (!plats.length) return;
  const card = $('card'), ok = $('ok'), pt = $('puntero');
  titulo(cfg.tarjeta.titulo); $('gracias').textContent = cfg.tarjeta.gracias;
  ok.classList.remove('on'); card.classList.remove('sale'); $('cod').textContent = '';
  ponerPlat(plats[0], 0, plats.length);
  replay(card, 'entra');
  await espera(800); if (id !== corrida) return;
  await tipear(plats[0].codigo, 120, id); if (id !== corrida) return;
  // el puntero aprieta ACEPTAR
  const b = $('btn').getBoundingClientRect(), w = $('wrap').getBoundingClientRect(), s = escala > 0 ? escala : 1;
  const bx = (b.left - w.left) / s + 30, by = (b.top - w.top) / s + 22;
  pt.style.transition = 'none'; pt.style.transform = `translate(${bx - 150}px,${by + 70}px)`; pt.style.opacity = 0; void pt.offsetWidth;
  pt.style.transition = ''; pt.style.opacity = 1; pt.style.transform = `translate(${bx}px,${by}px)`;
  await espera(950); if (id !== corrida) return;
  replay($('btn'), 'click'); pt.style.transform += ' scale(.8)';
  await espera(250); pt.style.opacity = 0;
  ok.classList.add('on'); monedas(22, bx - 10, by - 10);
  await espera(2200); if (id !== corrida) return;
  // más plataformas: gira el chip y escribe el código de cada una
  for (let k = 1; k < plats.length && Date.now() < fin - 2500; k++){
    ok.classList.remove('on');
    replay($('plat'), 'flip'); await espera(250); ponerPlat(plats[k], k, plats.length);
    if (plats[k].codigo !== $('cod').textContent) await tipear(plats[k].codigo, 60, id); else await espera(300);
    if (id !== corrida) return;
    await espera(2000); if (id !== corrida) return;
  }
  if (plats.length > 1){ ok.classList.add('on'); }
  await espera(Math.max(0, fin - Date.now())); if (id !== corrida) return;
  card.classList.remove('entra'); replay(card, 'sale');
}
async function cargar(){
  try { cfg = (await (await fetch('/api/codigo', { cache: 'no-store' })).json()).config; } catch (e) { console.warn('[Código] No se pudo leer la configuración:', e); }
}
cargar(); setInterval(cargar, 15000);
const es = new EventSource('/events?overlay=1');
es.onmessage = (ev) => { try { const m = JSON.parse(ev.data); if (m.type === 'codigo' && m.payload.que === 'tarjeta'){ cfg = m.payload.config; mostrar(m.payload.dur); } } catch (e) { console.warn('[Código]', e); } };
if (params.get('demo')) document.fonts.ready.then(async () => { await cargar(); const ciclo = () => mostrar(cfg.tarjeta.duracionSeg); ciclo(); setInterval(ciclo, (cfg.tarjeta.duracionSeg + 3) * 1000); });
</script>
</body>
</html>
