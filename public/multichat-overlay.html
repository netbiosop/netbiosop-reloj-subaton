<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Multichat · overlay</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap">
<style>
  :root{--tam:24px}
  html,body{margin:0;height:100%;background:transparent;overflow:hidden}
  body{font:500 var(--tam)/1.32 Inter,system-ui,sans-serif;color:#fff}
  #lista{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:.32em;padding:.4em}
  .mc-msg{background:rgba(12,10,18,.72);border-radius:.55em;padding:.32em .6em .36em;border-left:.22em solid var(--borde,#888);
    text-shadow:0 1px 2px rgba(0,0,0,.9);word-wrap:break-word;overflow-wrap:anywhere;animation:entra .35s cubic-bezier(.2,.9,.3,1.2) both;transform-origin:left bottom}
  .mc-msg.sale{animation:sale .5s ease forwards}
  .mc-p-twitch{--borde:#9146ff} .mc-p-kick{--borde:#53fc18} .mc-p-youtube{--borde:#ff0033} .mc-p-tiktok{--borde:#25f4ee}
  .mc-plat{display:inline-block;font:800 .58em/1 Inter,sans-serif;letter-spacing:.06em;padding:.32em .5em .3em;border-radius:.4em;vertical-align:.18em;text-shadow:none}
  .mc-rol{font-size:.85em;margin-right:.15em}
  .mc-autor{font-weight:800}
  .mc-sep{opacity:.7;margin-right:.1em}
  .mc-emote{height:1.35em;vertical-align:middle;margin:-.2em .05em}
  .mc-extra{display:inline-block;font-weight:800;background:linear-gradient(90deg,#ffd43b,#ff922b);color:#1b1200;text-shadow:none;border-radius:.4em;padding:.05em .45em;font-size:.85em}
  .mc-tipo-regalo,.mc-tipo-superchat,.mc-tipo-miembro{background:rgba(60,40,0,.78);border-left-color:#ffd43b}
  .solo .mc-plat{display:none}
  @keyframes entra{from{opacity:0;transform:translateY(.6em) scale(.96)}to{opacity:1;transform:none}}
  @keyframes sale{to{opacity:0;transform:translateX(-1em)}}
</style>
</head>
<body>
<div id="lista"></div>
<script src="/multichat-comun.js"></script>
<script>
const q = new URLSearchParams(location.search);
const solo = q.get('solo');               // ?solo=kick → una ventana por plataforma
const lista = document.getElementById('lista');
if (solo) document.body.classList.add('solo');
let cfg = { max: 10, duracionSeg: 0, tamano: 24 };
function aplicar(c){
  cfg = { ...cfg, ...(c.overlay || {}) };
  if (q.get('tam')) cfg.tamano = Number(q.get('tam'));
  document.documentElement.style.setProperty('--tam', cfg.tamano + 'px');
  recortar();
}
function recortar(){ while (lista.children.length > cfg.max) lista.firstElementChild.remove(); }
function agregar(m, animar = true){
  if (solo && m.plataforma !== solo) return;
  const el = Multichat.elemento(m, { conPlataforma: !solo });
  if (!animar) el.style.animation = 'none';
  lista.appendChild(el); recortar();
  if (cfg.duracionSeg > 0) {
    const resta = cfg.duracionSeg * 1000 - (Date.now() - (m.at || Date.now()));
    if (resta <= 0) return el.remove();
    setTimeout(() => { el.classList.add('sale'); setTimeout(() => el.remove(), 500); }, resta);
  }
}
Multichat.conectar({
  overlay: true,
  alConfig: aplicar,
  alInicio: (j) => { aplicar(j.config); (j.mensajes || []).slice(-cfg.max * 2).forEach((m) => agregar(m, false)); },
  alMensaje: (m) => agregar(m),
});
</script>
</body>
</html>
